<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" role="img" aria-label="opencode-shared-browser">
  <defs>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#509A7C" />
      <stop offset="100%" stop-color="#3a7a5e" />
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D58F32" />
      <stop offset="100%" stop-color="#b8741e" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <circle cx="42" cy="36" r="22" stroke="url(#gLeft)">
      <animate attributeName="stroke-dasharray" from="0 138" to="138 0" dur="1.2s" fill="freeze" />
    </circle>
    <circle cx="78" cy="36" r="22" stroke="url(#gRight)">
      <animate attributeName="stroke-dasharray" from="0 138" to="138 0" dur="1.2s" begin="0.3s" fill="freeze" />
    </circle>
  </g>
  <text x="60" y="42" text-anchor="middle" font-family="monospace" font-size="14" font-weight="600" fill="#e8e8e8" opacity="0">
    &lt;/&gt;
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze" />
  </text>
</svg>
