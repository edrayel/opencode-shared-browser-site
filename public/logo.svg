<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-label="opencode-shared-browser">
  <defs>
    <!-- Chromium brand colors -->
    <linearGradient id="ringLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A9BF6" />
      <stop offset="50%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#3367D6" />
    </linearGradient>
    <linearGradient id="ringRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06A5F" />
      <stop offset="50%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#FBBC05" />
      <stop offset="66%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
    <filter id="glowLeft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <ellipse cx="32" cy="48" rx="32" ry="32" fill="#4285F4" opacity="0.04" />
  <ellipse cx="88" cy="48" rx="32" ry="32" fill="#EA4335" opacity="0.04" />

  <!-- Left ring (Chromium blue) -->
  <g>
    <circle cx="32" cy="48" r="26" fill="none" stroke="url(#ringLeft)" stroke-width="5"
            stroke-dasharray="163" stroke-dashoffset="163" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="163" to="0" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </circle>
    <circle cx="32" cy="48" r="26" fill="none" stroke="#5A9BF6" stroke-width="1.5" opacity="0"
            stroke-dasharray="40 123" stroke-dashoffset="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="0.4s" begin="0.8s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" from="0 32 48" to="360 32 48" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right ring (Chrome red) -->
  <g>
    <circle cx="88" cy="48" r="26" fill="none" stroke="url(#ringRight)" stroke-width="5"
            stroke-dasharray="163" stroke-dashoffset="163" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="163" to="0" dur="1.0s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </circle>
    <circle cx="88" cy="48" r="26" fill="none" stroke="#F06A5F" stroke-width="1.5" opacity="0"
            stroke-dasharray="40 123" stroke-dashoffset="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="0.4s" begin="1.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" from="0 88 48" to="-360 88 48" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Overlap intersection glow -->
  <ellipse cx="60" cy="48" rx="5" ry="14" fill="url(#codeGrad)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.15" dur="0.6s" begin="1.2s" fill="freeze" />
  </ellipse>

  <!-- Code glyph </> -->
  <g opacity="0">
    <text x="60" y="54" text-anchor="middle"
          font-family="'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace"
          font-size="15" font-weight="600" fill="url(#codeGrad)" letter-spacing="-0.5">
      &lt;/&gt;
    </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.5s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
  </g>
</svg>
