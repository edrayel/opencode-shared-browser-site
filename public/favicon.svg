<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="opencode-shared-browser">
  <!--
    Simplified mark for favicon use.

    The product logo is a detailed 3D render with a globe grid and a </> glyph.
    Rasterised, it turns to mush below about 32px, so the small-size icon is a
    flat two-ring silhouette instead. Geometry was compared at 16/32/48px: this
    spacing and stroke weight is the only variant where both rings keep a visible
    counter at 16px instead of merging into one blob.

    Colours sampled from the render: left ring #509A7C, right ring #D58F32.
  -->
  <g fill="none" stroke-width="4.5">
    <circle cx="12" cy="16" r="6.5" stroke="#509A7C" />
    <circle cx="20" cy="16" r="6.5" stroke="#D58F32" />
  </g>
</svg>